name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Evaluar Proyecto
      id: evaluar-proyecto
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Evaluar Proyecto
        setup-command: mkdir -p bin && javac -encoding UTF-8 -cp lib/junit-platform-console-standalone-1.13.0-M3.jar
          -d bin $(find . -name "*.java")
        command: java -jar lib/junit-platform-console-standalone-1.13.0-M3.jar --class-path
          bin --scan-class-path
        timeout: 10
        max-score: 100
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        EVALUAR-PROYECTO_RESULTS: "${{steps.evaluar-proyecto.outputs.result}}"
      with:
        runners: evaluar-proyecto
